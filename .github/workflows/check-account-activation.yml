name: Check Unity Account Activation

# Answers one question: can this Unity account activate an editor in batch mode from
# UNITY_EMAIL / UNITY_PASSWORD alone, without a licence file?
#
# Why it matters: Unity has been retiring manual .alf activation for Personal licences -
# license.unity3d.com/manual now presents a Plus/Pro serial field rather than a Personal
# option - which leaves the .alf produced by acquire-activation-file.yml with nowhere to
# go. If batch-mode account activation still works on 6000.x, the build can activate
# itself on the runner and no licence file is needed anywhere. If it does not, the only
# remaining route is copying Unity_lic.ulf off a machine where Unity is already
# activated.
#
# This workflow deliberately produces NO artifact and prints NO licence content. It
# reports only whether a licence materialised, and its size. The password is passed
# through the container environment, so it never appears in a command line or the log.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.0.38f1-base-3

jobs:
  check:
    name: Probe batch-mode account activation
    runs-on: ubuntu-latest
    steps:
      - name: Require account credentials
        run: |
          if [ -z "${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}" ] \
          || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD must both be set."
            exit 1
          fi
          echo "Account credentials present."

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      - name: Attempt activation
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # -e passes the values by name: they are never interpolated into the command
          # line, so they cannot leak into the log or the process table.
          docker run --rm --entrypoint /bin/bash \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$UNITY_IMAGE" -c '
              set +e
              /opt/unity/Editor/Unity \
                -quit -batchmode -nographics \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -logfile /dev/stdout
              echo "=== Unity exit code: $? ==="

              found=""
              for candidate in \
                /root/.local/share/unity3d/Unity/Unity_lic.ulf \
                /usr/share/unity3d/Unity/Unity_lic.ulf
              do
                [ -s "$candidate" ] && found="$candidate" && break
              done
              [ -z "$found" ] && found="$(find / -maxdepth 8 -name "*.ulf" -size +0 -print -quit 2>/dev/null)"

              echo "=== RESULT ==="
              if [ -n "$found" ]; then
                # Location and size only. The contents are a credential and are never
                # printed, uploaded, or otherwise moved off this runner.
                echo "ACTIVATION_OK  path=$found  bytes=$(wc -c < "$found")"
              else
                echo "ACTIVATION_FAILED  no .ulf produced"
              fi
            ' | tee activation.log

          if grep -q "ACTIVATION_OK" activation.log; then
            echo "::notice::Batch-mode account activation WORKS. The build can activate itself on the runner; no UNITY_LICENSE secret is required."
          else
            echo "::error::Batch-mode account activation did not produce a licence. Read the Unity log above for the reason. Fallback: copy Unity_lic.ulf from a machine where Unity is already activated into the UNITY_LICENSE secret."
            exit 1
          fi
