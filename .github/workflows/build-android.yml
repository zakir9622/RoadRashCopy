name: Android Build & Release

# CI runs ONLY on pull requests targeting main, plus a manual dispatch button. The old
# push-to-main and daily-schedule triggers, and running the heavy Android build on every
# PR push, burned far too many Actions minutes on a private repo. Now:
#   - On a PR: the cheap EditMode gate runs (see the per-job `if` below). The ~31-min
#     Android build and the (upstream-broken) PlayMode job do NOT run automatically.
#   - The Android build + PlayMode run only via workflow_dispatch, when you actually want
#     an APK/AAB or to re-check PlayMode.
# Same-repo PRs (not forks) get full secrets access, so the Unity licence is available.
on:
  pull_request:
    branches: [main]

  # Manual 1-click trigger button in GitHub Actions tab. Use this to produce an APK/AAB.
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        type: boolean
        default: true
      build_format:
        description: 'Package format to build'
        type: choice
        options:
          - apk
          - aab
        default: 'apk'
      skip_tests:
        description: 'Build even if the Unity test suite fails (use sparingly)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # unity-test-runner publishes the pass/fail summary as a check run. Without this it
  # runs the whole suite, reports "Resource not accessible by integration" and fails the
  # job at the very last step - so a green 187/187 was being shown as a red build.
  checks: write

jobs:
  # Runs in seconds and gates everything expensive behind it. Both jobs below pull a
  # multi-GB Unity image before they can discover a missing licence, so without this a
  # misconfigured repository burns ~10 minutes per run to reach a failure that was
  # knowable immediately.
  preflight:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    steps:
      - name: Verify Unity credentials
        run: |
          HAS_LICENSE="${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}"
          HAS_SERIAL="${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}"
          HAS_EMAIL="${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}"
          HAS_PASSWORD="${{ secrets.UNITY_PASSWORD }}"

          [ -n "$HAS_LICENSE"  ] && echo "UNITY_LICENSE:  present" || echo "UNITY_LICENSE:  MISSING"
          [ -n "$HAS_SERIAL"   ] && echo "UNITY_SERIAL:   present" || echo "UNITY_SERIAL:   MISSING"
          [ -n "$HAS_EMAIL"    ] && echo "UNITY_EMAIL:    present" || echo "UNITY_EMAIL:    MISSING"
          [ -n "$HAS_PASSWORD" ] && echo "UNITY_PASSWORD: present" || echo "UNITY_PASSWORD: MISSING"

          # unity-builder needs a .ulf licence file or a serial - it derives the serial
          # from the licence file. Email and password alone are never sufficient.
          if [ -z "$HAS_LICENSE" ] && [ -z "$HAS_SERIAL" ]; then
            echo "::error::No Unity licence configured. Easiest route: activate Unity once on your own machine, then copy the whole of Unity_lic.ulf (Windows C:\\ProgramData\\Unity, macOS /Library/Application Support/Unity, Linux ~/.local/share/unity3d/Unity) into a UNITY_LICENSE secret. With a paid seat, set UNITY_SERIAL instead. Unity has been retiring manual .alf activation for Personal licences, so license.unity3d.com/manual may only offer a Plus/Pro serial."
            exit 1
          fi

          if [ -z "$HAS_EMAIL" ] || [ -z "$HAS_PASSWORD" ]; then
            echo "::warning::UNITY_EMAIL / UNITY_PASSWORD are not set. Activation usually needs them alongside the licence file."
          fi

  # The project has ~150 EditMode tests covering crash rules, race ordering, rival AI,
  # pooling and progression, and nothing was ever running them. A release build that has
  # not run its own test suite is not a tested release.
  # EditMode and PlayMode are two SEPARATE jobs, not one `testMode: all` run, for one
  # concrete reason. game-ci runs both platforms in a single Unity invocation and writes
  # the result XMLs only when that invocation finishes. PlayMode entry currently hangs on
  # this Unity/GameCI combination in headless CI (upstream game-ci/unity-test-runner#188),
  # so the process is killed by the timeout and NO editmode-results.xml is ever produced -
  # the hung run's artifact contains only playmode.log. Combined, that meant an EditMode
  # regression was completely invisible in CI: the build proceeded because the run was
  # "cancelled", never because EditMode actually passed.
  #
  # Split, EditMode runs as its own short invocation that does not hang, produces a real
  # pass/fail, and BLOCKS the build. PlayMode keeps its long timeout and stays advisory
  # until upstream is fixed.

  test-editmode:
    name: EditMode Tests
    runs-on: ubuntu-latest
    needs: preflight
    # EditMode does not enter play mode and does not hang; a clean run is ~3-5 minutes.
    # 15 is generous headroom, not a tuned bound.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      # unity-test-runner pulls the same multi-GB editor image as the build job. Without
      # this the pull dies with "no space left on device" - the exact failure that broke
      # the activation workflow.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      # The 18 CC0 textures and both HDRIs have never been in a CI build. They are
      # gitignored on purpose - the repository stores the recipe, not the output - and
      # nothing ever ran the fetcher, so every APK shipped to date has contained zero
      # textures and rendered entirely on runtime-generated flat colours.
      #
      # Cached on the manifest hash with no restore-keys. A partial restore keyed on an
      # older manifest is worse than a clean fetch: it mixes files pinned to different
      # SHA-256s, and --verify would then fail on assets that are individually fine.
      - name: Cache fetched CC0 art
        uses: actions/cache@v4
        with:
          path: Assets/_Project/Art
          key: art-${{ hashFiles('Tools/Assets/manifest.json') }}

      # continue-on-error: an upstream outage should degrade the build to the placeholder
      # look, not turn the whole pipeline red. Integrity is enforced by the next step,
      # which is not forgiving.
      - name: Fetch CC0 art
        continue-on-error: true
        run: python3 Tools/Assets/fetch-assets.py

      # Every asset carries a pinned SHA-256. A hash mismatch means the bytes changed
      # under a URL we do not control, and that is a hard stop rather than a warning.
      - name: Verify art integrity
        run: python3 Tools/Assets/fetch-assets.py --verify

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
        with:
          unityVersion: 6000.0.38f1
          testMode: EditMode
          artifactsPath: test-results-editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EditMode results
        uses: actions/upload-artifact@v4
        if: always()
        # Never let a storage-quota hit on this diagnostic XML fail the blocking gate. The
        # pass/fail is parsed and posted by the step above, before this runs - uploading the
        # raw results is a convenience for humans, not the gate. A full artifact store once
        # turned a genuine 228/228 pass into a red EditMode check.
        continue-on-error: true
        with:
          name: unity-test-results-editmode-${{ github.run_number }}
          path: test-results-editmode
          retention-days: 3

  test-playmode:
    name: PlayMode Tests (advisory)
    runs-on: ubuntu-latest
    needs: preflight
    # Dispatch-only: PlayMode is upstream-broken (crashes/hangs before any test runs) and
    # advisory, so running it on every PR just burned ~8 minutes for no signal. It now runs
    # only on a manual workflow_dispatch, for when you want to re-check whether upstream has
    # recovered.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # Advisory only: PlayMode entry hangs upstream (game-ci/unity-test-runner#188), so this
    # job is expected to hit the timeout and report 'cancelled' until that is fixed. The
    # build does not block on it. When upstream recovers, raise this and promote it to a
    # blocking gate alongside test-editmode.
    #
    # 12, not 25: the job hangs at PlayMode *entry* and never progresses, so a shorter
    # This job-level timeout is only a safety net. The real bound is the step-level timeout on
    # "Run PlayMode tests" below, because a *step* that times out is a tolerable failure under
    # continue-on-error (job stays green/advisory), whereas a *job* that hits this limit is
    # CANCELLED - and a cancelled job is not caught by continue-on-error, so the whole run
    # reported "cancelled" whenever PlayMode hung to the limit instead of crashing early. Keep
    # this comfortably above the step timeout so the step always fires first.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      - name: Cache fetched CC0 art
        uses: actions/cache@v4
        with:
          path: Assets/_Project/Art
          key: art-${{ hashFiles('Tools/Assets/manifest.json') }}

      - name: Fetch CC0 art
        continue-on-error: true
        run: python3 Tools/Assets/fetch-assets.py

      - name: Verify art integrity
        run: python3 Tools/Assets/fetch-assets.py --verify

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run PlayMode tests
        uses: game-ci/unity-test-runner@v4
        # Advisory: PlayMode entry breaks upstream on this Unity/GameCI combo
        # (game-ci/unity-test-runner#188) - it either segfaults (docker exit 139) or hangs
        # before any test runs. continue-on-error tolerates both so the advisory job never
        # blocks the build (which gates on test-editmode only) nor spams red PR checks.
        #
        # The step-level timeout is what makes the HANG case behave: a step that exceeds its
        # own timeout is a step FAILURE, which continue-on-error swallows -> job stays green.
        # (Relying on the job timeout instead cancels the whole run, which continue-on-error
        # cannot catch.) REMOVE both when upstream recovers and promote this to a real gate.
        continue-on-error: true
        timeout-minutes: 8
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
        with:
          unityVersion: 6000.0.38f1
          testMode: PlayMode
          artifactsPath: test-results-playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PlayMode results
        uses: actions/upload-artifact@v4
        if: always()
        # Diagnostic only, and this job is advisory anyway - a full artifact store must not
        # turn it into a hard error.
        continue-on-error: true
        with:
          name: unity-test-results-playmode-${{ github.run_number }}
          path: test-results-playmode
          retention-days: 3

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [preflight, test-editmode]
    # Same reasoning as the test jobs' timeouts: bound a real Unity build against GitHub's
    # 360-minute default so a hang costs 40 minutes of runner time, not six hours.
    timeout-minutes: 40
    # The gate, in plain terms:
    #   - workflow_dispatch only: the ~31-min build no longer runs on every PR. A PR runs the
    #     cheap EditMode gate (+ compile-check in the other workflow); you dispatch this when
    #     you actually want an APK/AAB.
    #   - preflight must pass (no licence -> nothing to build); never overridable.
    #   - test-editmode must genuinely SUCCEED. EditMode does not hang, so 'success' here is
    #     real signal and an EditMode regression correctly blocks the build.
    #   - test-playmode is advisory and dispatch-only, so it is absent from both `needs` and
    #     this condition - its outcome never gates the build.
    #   - inputs.skip_tests still forces a build regardless, for the manual dispatch case.
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && needs.preflight.result == 'success' && (needs.test-editmode.result == 'success' || inputs.skip_tests) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          # The Android editor image is ~7 GB compressed and considerably larger
          # unpacked, so the default runner does not have room for it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      # The 18 CC0 textures and both HDRIs have never been in a CI build. They are
      # gitignored on purpose - the repository stores the recipe, not the output - and
      # nothing ever ran the fetcher, so every APK shipped to date has contained zero
      # textures and rendered entirely on runtime-generated flat colours.
      #
      # Cached on the manifest hash with no restore-keys. A partial restore keyed on an
      # older manifest is worse than a clean fetch: it mixes files pinned to different
      # SHA-256s, and --verify would then fail on assets that are individually fine.
      - name: Cache fetched CC0 art
        uses: actions/cache@v4
        with:
          path: Assets/_Project/Art
          key: art-${{ hashFiles('Tools/Assets/manifest.json') }}

      # continue-on-error: an upstream outage should degrade the build to the placeholder
      # look, not turn the whole pipeline red. Integrity is enforced by the next step,
      # which is not forgiving.
      - name: Fetch CC0 art
        continue-on-error: true
        run: python3 Tools/Assets/fetch-assets.py

      # Every asset carries a pinned SHA-256. A hash mismatch means the bytes changed
      # under a URL we do not control, and that is a hard stop rather than a warning.
      - name: Verify art integrity
        run: python3 Tools/Assets/fetch-assets.py --verify

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Keyed on packages and project settings only, NOT on Assets/**.
          #
          # Including Assets/** meant every script edit minted a new key and saved a
          # fresh 1.7 GB cache. GitHub caps a repository at 10 GB and evicts the oldest
          # entry, so after a handful of commits the cache thrashed and every run paid
          # the full import cost it was supposed to avoid. What makes Library expensive
          # to rebuild is package resolution and asset import settings; changed scripts
          # recompile in seconds against a restored Library.
          key: Library-android-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Unity Android Builder
        uses: game-ci/unity-builder@v4
        id: unity_builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.38f1
          buildMethod: HighwayRenegade.Editor.BuildScript.BuildAndroid
          # -buildApk is what BuildScript actually reads (androidExportType below is consumed
          # by game-ci's own build script, which a custom buildMethod bypasses). It used to
          # be passed unconditionally, so selecting 'aab' in the dropdown silently produced
          # an APK anyway - and Play has required AAB for new apps since 2021, so every
          # artifact this pipeline made was unpublishable. Now -buildApk is included only
          # when NOT building an aab. Push and schedule runs carry no input, so build_format
          # is empty, which is not 'aab', so they stay APK (sideloadable, no keystore needed);
          # a release AAB is an explicit workflow_dispatch choice.
          customParameters: -customBuildPath build/Android ${{ github.event.inputs.build_format == 'aab' && ' ' || '-buildApk' }}
          androidExportType: ${{ github.event.inputs.build_format == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      # Between the builder and the release there was nothing asserting that an
      # installable package existed. A build that reported success while writing its
      # output to an unexpected path produced green runs and empty releases for weeks,
      # because the release step's glob simply matched nothing and carried on.
      #
      # This fails the job instead. -type f matters: the actual defect was a *directory*
      # named Android.apk, which a naive existence check would have accepted.
      - name: Locate and verify the package
        id: package
        run: |
          set -euo pipefail

          file="$(find build -type f \( -name '*.apk' -o -name '*.aab' \) \
                    -size +5M -print 2>/dev/null | head -1 || true)"

          if [ -z "$file" ]; then
            echo "::error::No .apk or .aab over 5 MB anywhere under build/."
            echo "--- what the build actually produced ---"
            find build -maxdepth 4 -exec ls -ld {} + || echo "(no build directory)"
            exit 1
          fi

          # Check the content, not the extension. An APK is a zip, so it starts "PK";
          # anything else with the right name is not installable.
          if [ "$(head -c 2 "$file")" != "PK" ]; then
            echo "::error::'$file' is not a zip archive, so it is not a valid package."
            exit 1
          fi

          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "Verified $(ls -lh "$file" | awk '{print $5}') at $file"

      # The generators are the source of truth for every scene, and BuildScript.EnsureScenes
      # reruns them on every build. But only TestTrack.unity was ever committed, so
      # MainMenu.unity and Garage.unity existed nowhere except inside a build container -
      # you could not open the front end in the editor, diff a scene change, or see what
      # the APK actually shipped.
      #
      # Committing the output keeps both properties: the generator still decides what a
      # scene contains, and the repository still records what was built. Gated on main so
      # branch builds never write, and on a verified package so a scene is only recorded
      # once it has been proven to produce an installable APK.
      - name: Commit regenerated scenes
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          # Unity ran as root inside the builder container, so the regenerated files are
          # root-owned and git refuses to touch them as the runner user.
          sudo chown -R "$(id -u):$(id -g)" Assets/_Project/Scenes ProjectSettings || true

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Assets/_Project/Scenes ProjectSettings/EditorBuildSettings.asset

          if git diff --cached --quiet; then
            echo "Scenes unchanged - nothing to commit."
            exit 0
          fi

          git diff --cached --stat

          # [skip ci] belts-and-braces alongside paths-ignore: if a future edit widens the
          # paths filter, this still stops the commit from triggering another build.
          git commit -m "Regenerate scenes from the generators [skip ci]" \
                     -m "Build ${{ github.run_number }} from ${{ github.sha }}."

          # The build takes ~20 minutes, so main may have moved since checkout. Rebase
          # rather than force: another commit landing mid-build is normal, not a conflict
          # to overwrite.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        # Skip on pull_request. The build still RUNS on every PR push (so we know it compiles
        # and produces a package - the verify step above proves that), but storing a ~39 MB
        # APK on every push is what fills the account's artifact quota, especially with an
        # hourly automated push cadence. Store the APK only when it is actually wanted: a
        # manual dispatch (to grab a build to sideload) or a merge to main. The quota then
        # stops refilling and old builds age out under the shorter retention below.
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: RoadRash-Android-${{ github.run_number }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          # 7, not 14: the APK is ~39 MB and is by far the largest consumer of the artifact
          # quota. A shorter retention lets old builds age out. Stays fatal on purpose - a
          # deliverable that cannot be stored is worth surfacing, unlike the diagnostic XMLs.
          retention-days: 7

      - name: Publish to GitHub Releases
        # success(), not !cancelled(): this previously ran even when the build failed,
        # publishing empty GitHub releases with no APK attached ("does not include a
        # valid file") for runs that never produced anything.
        #
        # Gated to the main ref as well, so pull_request builds (which have no inputs, hence
        # an empty create_release that would otherwise read as "not false") test and build
        # but never cut a release from a feature branch.
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Road Rash Android Build v1.0.${{ github.run_number }}"
          body: |
            ## 🏍️ Highway Renegade (Road Rash Mobile)
            
            **Build Details:**
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `main`
            - **Format**: ${{ github.event.inputs.build_format || 'apk' }}
            - **Date**: ${{ github.event.repository.updated_at }}
            
            ### 📥 Download & Install
            Download the attached `.apk` below and install it directly on your Android device.
          # The exact verified path, not a glob. A glob that matches nothing is a
          # warning here, not an error, so it published empty releases silently.
          files: ${{ steps.package.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
