name: Android Build & Release

on:
  # Daily scheduled build at 00:00 UTC (No push/commit spam)
  schedule:
    - cron: '0 0 * * *'
  
  # Manual 1-click trigger button in GitHub Actions tab
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        type: boolean
        default: true
      build_format:
        description: 'Package format to build'
        type: choice
        options:
          - apk
          - aab
        default: 'apk'
      skip_tests:
        description: 'Build even if the Unity test suite fails (use sparingly)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The project has ~150 EditMode tests covering crash rules, race ordering, rival AI,
  # pooling and progression, and nothing was ever running them. A release build that has
  # not run its own test suite is not a tested release.
  test:
    name: Unity Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
        with:
          unityVersion: 6000.0.38f1
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results-${{ github.run_number }}
          path: test-results
          retention-days: 14

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    # Tests gate the build by default; the manual trigger can override deliberately.
    if: ${{ !cancelled() && (needs.test.result == 'success' || inputs.skip_tests) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Verify Secret Availability
        run: |
          echo "=========================================="
          echo "   GAME-CI LICENSE SECRET DIAGNOSTICS     "
          echo "=========================================="
          if [ -n "${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}" ]; then
            echo "✅ UNITY_LICENSE: FOUND (Personal/Plus .ulf XML string)"
          else
            echo "❌ UNITY_LICENSE: NOT FOUND in Repository Secrets"
          fi
          
          if [ -n "${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}" ]; then
            echo "✅ UNITY_SERIAL: FOUND"
          else
            echo "❌ UNITY_SERIAL: NOT FOUND in Repository Secrets"
          fi
          
          if [ -n "${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}" ]; then
            echo "✅ UNITY_EMAIL: FOUND"
          else
            echo "❌ UNITY_EMAIL: NOT FOUND in Repository Secrets"
          fi

          if [ -n "${{ secrets.UNITY_PASSWORD }}" ]; then
            echo "✅ UNITY_PASSWORD: FOUND"
          else
            echo "❌ UNITY_PASSWORD: NOT FOUND in Repository Secrets"
          fi
          echo "=========================================="

      - name: Unity Android Builder
        uses: game-ci/unity-builder@v4
        id: unity_builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.38f1
          buildMethod: HighwayRenegade.Editor.BuildScript.BuildAndroid
          customParameters: -customBuildPath build/Android -buildApk
          androidExportType: ${{ github.event.inputs.build_format == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadRash-Android-${{ github.run_number }}
          path: build/Android
          retention-days: 14

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.create_release != 'false' && !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Road Rash Android Build v1.0.${{ github.run_number }}"
          body: |
            ## 🏍️ Highway Renegade (Road Rash Mobile)
            
            **Build Details:**
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `main`
            - **Format**: ${{ github.event.inputs.build_format || 'apk' }}
            - **Date**: ${{ github.event.repository.updated_at }}
            
            ### 📥 Download & Install
            Download the attached `.apk` below and install it directly on your Android device.
          files: |
            build/Android/*.apk
            build/Android/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
