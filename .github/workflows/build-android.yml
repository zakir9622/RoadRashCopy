name: Android Build & Release

on:
  # Daily scheduled build at 00:00 UTC (No push/commit spam)
  schedule:
    - cron: '0 0 * * *'
  
  # Manual 1-click trigger button in GitHub Actions tab
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        type: boolean
        default: true
      build_format:
        description: 'Package format to build'
        type: choice
        options:
          - apk
          - aab
        default: 'apk'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Unity Android Builder
        uses: game-ci/unity-builder@v4
        id: unity_builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.38f1
          buildMethod: HighwayRenegade.Editor.BuildScript.BuildAndroid
          customParameters: -customBuildPath build/Android -buildApk
          androidExportType: ${{ github.event.inputs.build_format == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadRash-Android-${{ github.run_number }}
          path: build/Android
          retention-days: 14

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.create_release != 'false' && !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Road Rash Android Build v1.0.${{ github.run_number }}"
          body: |
            ## 🏍️ Highway Renegade (Road Rash Mobile)
            
            **Build Details:**
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `main`
            - **Format**: ${{ github.event.inputs.build_format || 'apk' }}
            - **Date**: ${{ github.event.repository.updated_at }}
            
            ### 📥 Download & Install
            Download the attached `.apk` below and install it directly on your Android device.
          files: |
            build/Android/*.apk
            build/Android/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
