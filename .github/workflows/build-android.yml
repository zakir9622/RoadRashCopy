name: Android Build & Release

on:
  # Daily scheduled build at 00:00 UTC (No push/commit spam)
  schedule:
    - cron: '0 0 * * *'
  
  # Manual 1-click trigger button in GitHub Actions tab
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APK directly to GitHub Releases'
        type: boolean
        default: true
      build_format:
        description: 'Package format to build'
        type: choice
        options:
          - apk
          - aab
        default: 'apk'
      skip_tests:
        description: 'Build even if the Unity test suite fails (use sparingly)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # unity-test-runner publishes the pass/fail summary as a check run. Without this it
  # runs the whole suite, reports "Resource not accessible by integration" and fails the
  # job at the very last step - so a green 187/187 was being shown as a red build.
  checks: write

jobs:
  # Runs in seconds and gates everything expensive behind it. Both jobs below pull a
  # multi-GB Unity image before they can discover a missing licence, so without this a
  # misconfigured repository burns ~10 minutes per run to reach a failure that was
  # knowable immediately.
  preflight:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    steps:
      - name: Verify Unity credentials
        run: |
          HAS_LICENSE="${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}"
          HAS_SERIAL="${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}"
          HAS_EMAIL="${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}"
          HAS_PASSWORD="${{ secrets.UNITY_PASSWORD }}"

          [ -n "$HAS_LICENSE"  ] && echo "UNITY_LICENSE:  present" || echo "UNITY_LICENSE:  MISSING"
          [ -n "$HAS_SERIAL"   ] && echo "UNITY_SERIAL:   present" || echo "UNITY_SERIAL:   MISSING"
          [ -n "$HAS_EMAIL"    ] && echo "UNITY_EMAIL:    present" || echo "UNITY_EMAIL:    MISSING"
          [ -n "$HAS_PASSWORD" ] && echo "UNITY_PASSWORD: present" || echo "UNITY_PASSWORD: MISSING"

          # unity-builder needs a .ulf licence file or a serial - it derives the serial
          # from the licence file. Email and password alone are never sufficient.
          if [ -z "$HAS_LICENSE" ] && [ -z "$HAS_SERIAL" ]; then
            echo "::error::No Unity licence configured. Easiest route: activate Unity once on your own machine, then copy the whole of Unity_lic.ulf (Windows C:\\ProgramData\\Unity, macOS /Library/Application Support/Unity, Linux ~/.local/share/unity3d/Unity) into a UNITY_LICENSE secret. With a paid seat, set UNITY_SERIAL instead. Unity has been retiring manual .alf activation for Personal licences, so license.unity3d.com/manual may only offer a Plus/Pro serial."
            exit 1
          fi

          if [ -z "$HAS_EMAIL" ] || [ -z "$HAS_PASSWORD" ]; then
            echo "::warning::UNITY_EMAIL / UNITY_PASSWORD are not set. Activation usually needs them alongside the licence file."
          fi

  # The project has ~150 EditMode tests covering crash rules, race ordering, rival AI,
  # pooling and progression, and nothing was ever running them. A release build that has
  # not run its own test suite is not a tested release.
  test:
    name: Unity Test Suite
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      # unity-test-runner pulls the same multi-GB editor image as the build job. Without
      # this the pull dies with "no space left on device" - the exact failure that broke
      # the activation workflow.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
        with:
          unityVersion: 6000.0.38f1
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results-${{ github.run_number }}
          path: test-results
          retention-days: 14

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [preflight, test]
    # Tests gate the build by default; the manual trigger can override deliberately.
    # preflight is never overridable: without a licence there is nothing to build.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.test.result == 'success' || inputs.skip_tests) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Free runner disk space
        run: |
          # The Android editor image is ~7 GB compressed and considerably larger
          # unpacked, so the default runner does not have room for it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/share/powershell /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h / | tail -1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Keyed on packages and project settings only, NOT on Assets/**.
          #
          # Including Assets/** meant every script edit minted a new key and saved a
          # fresh 1.7 GB cache. GitHub caps a repository at 10 GB and evicts the oldest
          # entry, so after a handful of commits the cache thrashed and every run paid
          # the full import cost it was supposed to avoid. What makes Library expensive
          # to rebuild is package resolution and asset import settings; changed scripts
          # recompile in seconds against a restored Library.
          key: Library-android-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Unity Android Builder
        uses: game-ci/unity-builder@v4
        id: unity_builder
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE || secrets.UNITY_LICENSE_FILE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL || secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL || secrets.UNITY_SERIAL_KEY || secrets.UNITY_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.38f1
          buildMethod: HighwayRenegade.Editor.BuildScript.BuildAndroid
          customParameters: -customBuildPath build/Android -buildApk
          androidExportType: ${{ github.event.inputs.build_format == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          allowDirtyBuild: true

      # Between the builder and the release there was nothing asserting that an
      # installable package existed. A build that reported success while writing its
      # output to an unexpected path produced green runs and empty releases for weeks,
      # because the release step's glob simply matched nothing and carried on.
      #
      # This fails the job instead. -type f matters: the actual defect was a *directory*
      # named Android.apk, which a naive existence check would have accepted.
      - name: Locate and verify the package
        id: package
        run: |
          set -euo pipefail

          file="$(find build -type f \( -name '*.apk' -o -name '*.aab' \) \
                    -size +5M -print 2>/dev/null | head -1 || true)"

          if [ -z "$file" ]; then
            echo "::error::No .apk or .aab over 5 MB anywhere under build/."
            echo "--- what the build actually produced ---"
            find build -maxdepth 4 -exec ls -ld {} + || echo "(no build directory)"
            exit 1
          fi

          # Check the content, not the extension. An APK is a zip, so it starts "PK";
          # anything else with the right name is not installable.
          if [ "$(head -c 2 "$file")" != "PK" ]; then
            echo "::error::'$file' is not a zip archive, so it is not a valid package."
            exit 1
          fi

          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "Verified $(ls -lh "$file" | awk '{print $5}') at $file"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadRash-Android-${{ github.run_number }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Releases
        # success(), not !cancelled(): this previously ran even when the build failed,
        # publishing empty GitHub releases with no APK attached ("does not include a
        # valid file") for runs that never produced anything.
        if: ${{ success() && github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Road Rash Android Build v1.0.${{ github.run_number }}"
          body: |
            ## 🏍️ Highway Renegade (Road Rash Mobile)
            
            **Build Details:**
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `main`
            - **Format**: ${{ github.event.inputs.build_format || 'apk' }}
            - **Date**: ${{ github.event.repository.updated_at }}
            
            ### 📥 Download & Install
            Download the attached `.apk` below and install it directly on your Android device.
          # The exact verified path, not a glob. A glob that matches nothing is a
          # warning here, not an error, so it published empty releases silently.
          files: ${{ steps.package.outputs.path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
