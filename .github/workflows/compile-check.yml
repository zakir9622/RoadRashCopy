name: Compile Check

# Manual compile gate — does not run on every push/PR (saves Actions minutes).
# Run locally with: Tools/CompileCheck/compile-check.sh --tests
# Or trigger from the Actions tab when you want a remote check.
#
# See Tools/CompileCheck/README.md for what this proves and what it does not.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile C# (player + editor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Unity reference assemblies
        uses: actions/cache@v4
        with:
          path: Tools/CompileCheck/.work/refs
          key: compilecheck-refs-${{ hashFiles('Tools/CompileCheck/compile-check.sh') }}

      - name: Compile all assemblies and tests
        run: Tools/CompileCheck/compile-check.sh --tests
